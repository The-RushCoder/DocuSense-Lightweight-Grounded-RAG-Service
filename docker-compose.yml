version: "3.9"

services:

  # ── Backend API ──────────────────────────────────────────────
  docusense:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docusense-api
    ports:
      # Expose for local dev / debugging. In production remove this
      # and let the frontend nginx proxy be the only entry point.
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Persist the FAISS index across container restarts.
      # Build the index first:
      #   docker compose run docusense python -m app.ingestion.indexer
      - ./storage:/app/storage
      # Mount data dir so policy docs can be updated without rebuild
      - ./data:/app/data
      # Mount tests dir for running tests inside the container
      - ./tests:/app/tests
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend (nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docusense-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      docusense:
        condition: service_healthy   # wait for backend to pass health check
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
