version: "3.9"

services:
  docusense:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docusense-api
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Persist the FAISS index across container restarts.
      # Build the index first: docker compose run docusense python -m app.ingestion.indexer
      - ./storage:/app/storage
      # Mount data directory so policy document can be updated without rebuild
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
